name: Benchmarks

on:
  workflow_run:
    workflows:
      - Main Extension Distribution Pipeline
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: benchmark-pages
  cancel-in-progress: true

jobs:
  benchmark:
    name: Compare current and previous commits
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out benchmark revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Download extension artifacts
        id: revisions
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          current_revision=$(git rev-parse HEAD)
          previous_revision=$(git rev-parse HEAD^)
          current_run_id="$CURRENT_RUN_ID"
          if [ -z "$current_run_id" ]; then
            current_run_id=$(gh run list \
              --workflow MainDistributionPipeline.yml \
              --commit "$current_revision" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          previous_run_id=$(gh run list \
            --workflow MainDistributionPipeline.yml \
            --commit "$previous_revision" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          test -n "$current_run_id"
          test -n "$previous_run_id"
          gh run download "$current_run_id" \
            --name apart-v1.5.4-extension-linux_amd64 \
            --dir extension-current
          gh run download "$previous_run_id" \
            --name apart-v1.5.4-extension-linux_amd64 \
            --dir extension-previous
          echo "current=$current_revision" >> "$GITHUB_OUTPUT"
          echo "previous=$previous_revision" >> "$GITHUB_OUTPUT"

      - name: Download DuckDB
        run: |
          curl --fail --location --retry 3 \
            https://github.com/duckdb/duckdb/releases/download/v1.5.4/duckdb_cli-linux-amd64.zip \
            --output duckdb.zip
          unzip -q duckdb.zip -d duckdb

      - name: Run benchmark matrix
        run: |
          python3 benchmark/run_matrix.py \
            --duckdb-binary duckdb/duckdb \
            --current-extension extension-current/apart.duckdb_extension \
            --previous-extension extension-previous/apart.duckdb_extension \
            --current-revision "${{ steps.revisions.outputs.current }}" \
            --previous-revision "${{ steps.revisions.outputs.previous }}" \
            --repository "${{ github.repository }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output benchmark-results

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ steps.revisions.outputs.current }}
          path: benchmark-results/artifacts
          if-no-files-found: error
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: benchmark-results/site

  deploy:
    name: Publish benchmark page
    needs: benchmark
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
