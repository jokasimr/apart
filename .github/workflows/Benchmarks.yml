name: Benchmarks

on:
  workflow_run:
    workflows:
      - Main Extension Distribution Pipeline
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: benchmark-pages
  cancel-in-progress: true

jobs:
  benchmark:
    name: Compare current and baseline revisions
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out benchmark revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Download extension artifacts
        id: revisions
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          current_revision=$(git rev-parse HEAD)
          current_run_id="$CURRENT_RUN_ID"
          if [ -z "$current_run_id" ]; then
            current_run_id=$(gh run list \
              --workflow MainDistributionPipeline.yml \
              --commit "$current_revision" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          test -n "$current_run_id"
          gh run download "$current_run_id" \
            --name apart-v1.5.4-extension-linux_amd64 \
            --dir extension-current

          previous_revision=""
          baseline_extension=""
          baseline_artifact=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '[.artifacts[]
              | select(.expired == false)
              | select(.workflow_run.head_branch == "main")
              | select(.name | startswith("benchmark-results-"))]
              | sort_by(.created_at)
              | last
              | if . == null then "" else "\(.workflow_run.id)\t\(.name)" end')
          if [ -n "$baseline_artifact" ]; then
            IFS=$'\t' read -r baseline_run_id baseline_artifact_name <<< "$baseline_artifact"
            gh run download "$baseline_run_id" \
              --name "$baseline_artifact_name" \
              --dir benchmark-baseline
            baseline_metadata=$(find benchmark-baseline -name metadata.json -print -quit)
            test -n "$baseline_metadata"
            previous_revision=$(jq -r '.current.revision' "$baseline_metadata")
            baseline_extension=$(find benchmark-baseline -name apart.duckdb_extension -print -quit)
          fi

          if [ -n "$baseline_extension" ]; then
            mkdir -p extension-previous
            cp "$baseline_extension" extension-previous/apart.duckdb_extension
          elif [ -n "$previous_revision" ]; then
            previous_run_id=$(gh run list \
              --workflow MainDistributionPipeline.yml \
              --commit "$previous_revision" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
            if [ -z "$previous_run_id" ] || ! gh run download "$previous_run_id" \
                --name apart-v1.5.4-extension-linux_amd64 \
                --dir extension-previous; then
              previous_revision=""
            fi
          fi
          echo "current=$current_revision" >> "$GITHUB_OUTPUT"
          echo "previous=$previous_revision" >> "$GITHUB_OUTPUT"

      - name: Download DuckDB
        run: |
          curl --fail --location --retry 3 \
            https://github.com/duckdb/duckdb/releases/download/v1.5.4/duckdb_cli-linux-amd64.zip \
            --output duckdb.zip
          unzip -q duckdb.zip -d duckdb

      - name: Run benchmark matrix
        env:
          CURRENT_REVISION: ${{ steps.revisions.outputs.current }}
          PREVIOUS_REVISION: ${{ steps.revisions.outputs.previous }}
        run: |
          comparison_args=()
          if [ -n "$PREVIOUS_REVISION" ]; then
            comparison_args=(
              --previous-extension extension-previous/apart.duckdb_extension
              --previous-revision "$PREVIOUS_REVISION"
            )
          fi
          python3 benchmark/run_matrix.py \
            --duckdb-binary duckdb/duckdb \
            --current-extension extension-current/apart.duckdb_extension \
            --current-revision "$CURRENT_REVISION" \
            --repository "${{ github.repository }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${comparison_args[@]}" \
            --output benchmark-results

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ steps.revisions.outputs.current }}
          path: benchmark-results/artifacts
          if-no-files-found: error
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: benchmark-results/site

  deploy:
    name: Publish benchmark page
    needs: benchmark
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
