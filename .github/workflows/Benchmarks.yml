name: Benchmarks

on:
  workflow_run:
    workflows:
      - Main Extension Distribution Pipeline
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: benchmark-pages
  cancel-in-progress: false

jobs:
  benchmark:
    name: Compare revision and baseline
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out benchmark revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check out benchmark history
        run: |
          history_revision=$(git ls-remote --heads origin benchmark-history)
          if [ -n "$history_revision" ]; then
            git fetch --depth=1 origin benchmark-history
            git worktree add --detach benchmark-history FETCH_HEAD
          else
            git worktree add --detach benchmark-history
            git -C benchmark-history switch --orphan benchmark-history
          fi

      - name: Download extension artifacts
        id: revisions
        env:
          GH_TOKEN: ${{ github.token }}
          DISTRIBUTION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          revision=$(git rev-parse HEAD)
          distribution_run_id="$DISTRIBUTION_RUN_ID"
          if [ -z "$distribution_run_id" ]; then
            distribution_run_id=$(gh run list \
              --workflow MainDistributionPipeline.yml \
              --commit "$revision" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          test -n "$distribution_run_id"
          gh run download "$distribution_run_id" \
            --name apart-v1.5.4-extension-linux_amd64 \
            --dir extension-candidate

          baseline_revision=""
          baseline_run_id=$(gh run list \
            --workflow Benchmarks.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -n "$baseline_run_id" ] && gh run download "$baseline_run_id" \
              --pattern 'benchmark-results-*' \
              --dir benchmark-baseline; then
            baseline_metadata=$(find benchmark-baseline -name metadata.json -print -quit)
            baseline_extension=$(find benchmark-baseline -name apart.duckdb_extension -print -quit)
            if [ -n "$baseline_metadata" ] && [ -n "$baseline_extension" ]; then
              # The fallback reads the existing pre-history artifact.
              baseline_revision=$(jq -r '.revision // .current.revision // empty' "$baseline_metadata")
              if [ -n "$baseline_revision" ]; then
                mkdir -p extension-baseline
                cp "$baseline_extension" extension-baseline/apart.duckdb_extension
              fi
            fi
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline_revision" >> "$GITHUB_OUTPUT"

      - name: Download DuckDB
        run: |
          curl --fail --location --retry 3 \
            https://github.com/duckdb/duckdb/releases/download/v1.5.4/duckdb_cli-linux-amd64.zip \
            --output duckdb.zip
          unzip -q duckdb.zip -d duckdb

      - name: Run benchmark matrix
        env:
          REVISION: ${{ steps.revisions.outputs.revision }}
          BASELINE_REVISION: ${{ steps.revisions.outputs.baseline }}
        run: |
          comparison_args=()
          if [ -n "$BASELINE_REVISION" ]; then
            comparison_args=(
              --baseline-extension extension-baseline/apart.duckdb_extension
              --baseline-revision "$BASELINE_REVISION"
            )
          fi
          python3 benchmark/run_matrix.py \
            --duckdb-binary duckdb/duckdb \
            --extension extension-candidate/apart.duckdb_extension \
            --revision "$REVISION" \
            --repository "${{ github.repository }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${comparison_args[@]}" \
            --history-dir benchmark-history/public \
            --output benchmark-results

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ steps.revisions.outputs.revision }}
          path: benchmark-results/artifacts
          if-no-files-found: error
          retention-days: 90

      - name: Save benchmark history
        env:
          REVISION: ${{ steps.revisions.outputs.revision }}
        run: |
          git -C benchmark-history config user.name "github-actions[bot]"
          git -C benchmark-history config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C benchmark-history add --all public
          if ! git -C benchmark-history diff --cached --quiet; then
            git -C benchmark-history commit -m "Update benchmarks for ${REVISION:0:12}"
            git -C benchmark-history push origin HEAD:benchmark-history
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: benchmark-history/public

  deploy:
    name: Publish benchmark page
    needs: benchmark
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
